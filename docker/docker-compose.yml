services:
  dev:
    build: .
    # arm64 네이티브로 구동 (Mac에서 최고 성능).
    # 공식 시뮬 바이너리(aima-sim-app)는 클로즈드소스 모듈에 AVX가 포함되어
    # Rosetta(amd64 에뮬)에서 실행 불가 확인(2026-08-07) → 자체 arm64
    # Python MuJoCo 시뮬 노드(ros2_ws/src/x2_sim)로 대체.
    # 공식 시뮬은 추후 x86 네이티브 Ubuntu PC에서 그대로 사용 가능.
    platform: linux/arm64
    image: agibot-x2-dev:humble-arm64
    container_name: agibot-dev
    # ros2_ws(워크스페이스)와 sdk를 컨테이너에 마운트
    volumes:
      - ../ros2_ws:/ws
      - ../sdk:/sdk
      - ../scripts:/scripts
      - ../chat:/chat
    # 프로젝트 루트의 .env에서 ANTHROPIC_API_KEY 주입
    env_file:
      - ../.env
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - MUJOCO_GL=osmesa
    # Phase 4 채팅 앱/영상 스트림 포트 (호스트 브라우저에서 접속)
    ports:
      - "8000:8000"   # FastAPI (채팅 백엔드)
      - "8080:8080"   # web_video_server / MJPEG
      - "9090:9090"   # rosbridge websocket
    stdin_open: true
    tty: true
